<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جزیره اعلمی | Alami Island</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0b;--card:#171313;--text:#efe9e6;--mute:#a79b97;--red:#e11d2e;--deep:#5a0007}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
body.locked{overflow:hidden}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:99;background:#000;overflow:hidden;cursor:pointer;animation:flash 5.4s forwards}
@keyframes flash{0%,90%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
#intro .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#8a000c 0,#2c0005 45%,#000 82%);opacity:0;animation:lights 5s forwards}
@keyframes lights{0%,10%{opacity:0}12%{opacity:.9}14%{opacity:0}18%{opacity:1}20%{opacity:.1}23%{opacity:1}25%{opacity:.2}28%,100%{opacity:1}}
#intro .stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:quake .06s 2.35s 9 alternate}
@keyframes quake{from{transform:translate(-9px,5px)}to{transform:translate(9px,-5px)}}
.skull{animation:zoom 1.4s cubic-bezier(.1,.9,.2,1) 1s both,throb 1.3s 3.4s infinite}
.skull svg{display:block;width:clamp(150px,38vw,270px);filter:drop-shadow(0 0 22px #f00) drop-shadow(0 0 60px #a00)}
@keyframes zoom{0%{transform:scale(7);opacity:0;filter:blur(22px)}55%{opacity:1}100%{transform:scale(1);opacity:1;filter:blur(0)}}
@keyframes throb{50%{transform:scale(1.07)}}
.eye{opacity:0;transform-box:fill-box;transform-origin:center;animation:eye .7s 2.35s infinite alternate both}
@keyframes eye{from{opacity:.55;transform:scale(.7)}to{opacity:1;transform:scale(1.5)}}
.jaw{animation:chat .16s 2.5s 14 alternate}
@keyframes chat{to{transform:translateY(9px)}}
.t{font-weight:800;font-size:clamp(40px,11vw,88px);color:#fff;margin-top:12px;opacity:0;
 text-shadow:0 0 18px #f00,0 0 46px #e11d2e;animation:reveal 1.2s 3s both,glitch 2.4s 4.3s infinite}
@keyframes reveal{from{opacity:0;letter-spacing:.35em;filter:blur(14px)}to{opacity:1;letter-spacing:0;filter:blur(0)}}
@keyframes glitch{0%,88%,100%{transform:none;text-shadow:0 0 18px #f00,0 0 46px #e11d2e}
 90%{transform:translate(-8px,2px) skewX(8deg);text-shadow:6px 0 #0ff,-6px 0 #f00}
 93%{transform:translate(8px,-2px) skewX(-8deg);text-shadow:-6px 0 #0ff,6px 0 #f00}96%{transform:none}}
.en{direction:ltr;letter-spacing:.55em;color:#ff7b86;font-weight:300;font-size:clamp(13px,3.4vw,22px);opacity:0;animation:fadein 1s 3.6s both}
.wh{color:#b88;font-size:clamp(13px,3vw,17px);margin-top:14px;opacity:0;animation:fadein 1.2s 4.2s both,flick 1.6s 5s infinite}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.35}50%{opacity:1}}
.drips{position:absolute;inset:0;z-index:1;pointer-events:none}
.drip{position:absolute;top:0;height:0;background:linear-gradient(#a00010,#e11d2e);border-radius:0 0 40px 40px;box-shadow:0 0 14px #900;animation:fall var(--d) var(--t) ease-in forwards}
@keyframes fall{to{height:var(--h)}}
.vig{position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 170px 70px #000;animation:vig 1.3s infinite}
@keyframes vig{50%{box-shadow:inset 0 0 220px 100px #000}}
#intro::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
.hit{position:absolute;inset:0;z-index:5;background:#ff1a2b;opacity:0;pointer-events:none;animation:hit .6s 2.3s}
@keyframes hit{0%{opacity:1}100%{opacity:0}}
.skip{position:absolute;z-index:6;bottom:18px;width:100%;text-align:center;color:#7a5a5a;font-size:13px}

/* ---------- site ---------- */
header{text-align:center;padding:90px 20px 50px}
header h1{font-size:clamp(34px,7vw,60px);font-weight:800;letter-spacing:-.01em}
header h1 span{display:block;direction:ltr;font-size:.32em;font-weight:300;color:var(--red);letter-spacing:.45em;margin-top:6px}
header p{color:var(--mute);margin-top:14px}
main{max-width:1060px;margin:0 auto;padding:0 20px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:28px}
figure{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid #261e1e;transition:border-color .25s}
figure:hover{border-color:var(--red)}
figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
figcaption{padding:16px 18px 20px;white-space:pre-line;font-weight:300}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
footer{text-align:center;color:#6c6260;padding:30px;border-top:1px solid #1e1818;font-size:14px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
@media(prefers-reduced-motion:reduce){#intro *,#intro{animation-duration:.01s!important;animation-delay:0s!important}#intro{animation:flash 1.2s forwards!important}}

/* ---------- extra horror ---------- */
.topbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:8px 14px;font-size:12px;color:#9a6a6a;background:#0a0606;border-bottom:1px solid #2a1212;letter-spacing:.03em;text-align:center}
.ic{width:14px;height:14px;color:var(--red);flex:none;filter:drop-shadow(0 0 4px #f00)}
header{position:relative;overflow:hidden}
header>*{position:relative;z-index:1}
.sigil{position:absolute!important;z-index:0!important;left:50%;top:50%;width:min(520px,90vw);height:min(520px,90vw);margin:calc(min(520px,90vw)/-2) 0 0 calc(min(520px,90vw)/-2);color:var(--red);opacity:.13;animation:spin 70s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
header h1{animation:hflick 6s infinite;text-shadow:0 0 22px rgba(225,29,46,.55)}
@keyframes hflick{0%,92%,100%{opacity:1}93%{opacity:.35}94%{opacity:1}96%{opacity:.5}97%{opacity:1}}
body::before{content:"";position:fixed;inset:0;z-index:40;pointer-events:none;
 background:radial-gradient(ellipse at 20% 110%,rgba(130,0,10,.35),transparent 55%),radial-gradient(ellipse at 85% 105%,rgba(90,0,7,.35),transparent 55%),radial-gradient(circle,transparent 55%,rgba(0,0,0,.65) 100%);animation:fog 9s ease-in-out infinite alternate}
@keyframes fog{to{opacity:.65}}
figure img{filter:grayscale(.55) contrast(1.15) brightness(.8) sepia(.25);transition:filter .35s,transform .35s}
figure:hover{box-shadow:0 0 28px rgba(225,29,46,.45);animation:tremble .18s 2}
figure:hover img{filter:none;transform:scale(1.03)}
figure{overflow:hidden}
@keyframes tremble{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.eyes{position:fixed;z-index:41;pointer-events:none;display:flex;gap:14px;animation:blink 7s infinite}
.eyes i{display:block;width:12px;height:7px;border-radius:50%;background:#ff1a1a;box-shadow:0 0 10px 3px #f00,0 0 22px 6px #a00}
@keyframes blink{0%,44%,48%,100%{opacity:.9}46%{opacity:0}}
.foot6{letter-spacing:.3em;color:#7a2a2a}

/* ---------- level 2 horror ---------- */
#dark{position:fixed;inset:0;z-index:39;pointer-events:none;--x:50vw;--y:40vh;
 background:radial-gradient(circle 300px at var(--x) var(--y),transparent 0,rgba(0,0,0,.35) 55%,rgba(0,0,0,.86) 100%)}
body::after{content:"";position:fixed;inset:-50%;z-index:38;pointer-events:none;opacity:.09;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain .5s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}100%{transform:translate(3%,3%)}}
.hd{position:absolute;left:0;right:0;top:0;z-index:2;pointer-events:none}
#trail{position:fixed;inset:0;z-index:45;pointer-events:none}
.whisper{position:fixed;z-index:42;pointer-events:none;color:#c0121f;font-weight:800;font-size:clamp(18px,4vw,34px);opacity:0;
 text-shadow:0 0 14px #600;animation:wh 4s ease-in-out forwards;white-space:nowrap}
@keyframes wh{0%{opacity:0;filter:blur(10px)}25%,65%{opacity:.75;filter:blur(1.5px)}100%{opacity:0;filter:blur(8px)}}
#js{position:fixed;inset:0;z-index:98;background:#c4000f;display:none;align-items:center;justify-content:center;pointer-events:none}
#js.on{display:flex;animation:jshake .07s 7 alternate}
#js svg{width:min(80vw,520px);filter:drop-shadow(0 0 40px #000);animation:jzoom .55s ease-out both}
@keyframes jzoom{from{transform:scale(.3)}to{transform:scale(1.25)}}
@keyframes jshake{from{transform:translate(-14px,8px)}to{transform:translate(14px,-8px)}}
.snd{position:fixed;z-index:60;bottom:14px;left:14px;background:#1a0a0a;color:#d88;border:1px solid #5a1a1a;border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.snd:hover{background:#2a0e0e}
figcaption{text-shadow:0 0 8px rgba(225,29,46,.25)}
@media(prefers-reduced-motion:reduce){body::after,.whisper{animation:none}}

/* ---------- level 3 + mobile ---------- */
.whisper{white-space:normal;max-width:78vw}
.snd{bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:10px 16px;font-size:14px}
.splat{position:fixed;inset:0;z-index:37;pointer-events:none;opacity:.7;
 background:
 radial-gradient(circle at 3% 5%,#5a0007 0 4.5%,transparent 5%),radial-gradient(circle at 8% 10%,#5a0007 0 2%,transparent 2.4%),
 radial-gradient(circle at 12% 3%,#5a0007 0 1.2%,transparent 1.6%),radial-gradient(circle at 97% 92%,#5a0007 0 5%,transparent 5.4%),
 radial-gradient(circle at 91% 96%,#5a0007 0 2.2%,transparent 2.6%),radial-gradient(circle at 99% 80%,#5a0007 0 1.4%,transparent 1.8%),
 radial-gradient(circle at 1% 70%,#4a0006 0 3%,transparent 3.4%),radial-gradient(circle at 6% 76%,#4a0006 0 1.3%,transparent 1.7%)}
.claw{position:absolute!important;z-index:2!important;width:84px;opacity:.75;pointer-events:none;filter:drop-shadow(0 0 6px #f00)}
.claw.a{right:4%;top:44px}.claw.b{left:3%;bottom:10px;transform:scaleX(-1) rotate(8deg)}
.claw path{stroke-dasharray:1;stroke-dashoffset:1;animation:scratch .7s ease-out forwards}
.claw path:nth-child(1){animation-delay:5.6s}.claw path:nth-child(2){animation-delay:5.8s}.claw path:nth-child(3){animation-delay:6s}
@keyframes scratch{to{stroke-dashoffset:0}}
figure.lit{border-color:var(--red);box-shadow:0 0 28px rgba(225,29,46,.45)}
figure.lit img{filter:none;transform:scale(1.03)}
.gl{animation:glt .35s steps(3)}
@keyframes glt{0%{transform:translateX(-6px) skewX(4deg);filter:hue-rotate(90deg) saturate(3)}50%{transform:translateX(7px) skewX(-5deg);filter:invert(.15)}100%{transform:none}}
@media(pointer:coarse){
 #dark{background:radial-gradient(circle 185px at var(--x) var(--y),transparent 0,rgba(0,0,0,.3) 55%,rgba(0,0,0,.85) 100%)}
 body::after{animation:none}
 header{padding-top:70px}
}

.shade{position:fixed;bottom:0;z-index:43;pointer-events:none;height:58vh;width:calc(58vh*.44);margin-left:calc(-58vh*.22);
 transform-origin:50% 100%;opacity:0;animation:creep 5.5s ease-in forwards}
.shade svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(210,0,20,.8)) drop-shadow(0 0 30px rgba(130,0,10,.7))}
@keyframes creep{0%{opacity:0;transform:scale(.4);filter:blur(7px)}18%{opacity:.92}80%{opacity:.92;transform:scale(1);filter:blur(0)}90%{transform:scale(1.6);opacity:1}100%{transform:scale(2.3);opacity:0}}
</style>
</head>

<script>
function endIntro(){document.getElementById('intro').style.display='none';document.body.classList.remove('locked')}
setTimeout(endIntro,5400);
const dr=document.getElementById('drips');
for(let i=0;i<34;i++){const d=document.createElement('i');d.className='drip';
 d.style.cssText=`left:${Math.random()*100}%;width:${6+Math.random()*16}px;--h:${15+Math.random()*65}%;--d:${1.5+Math.random()*2}s;--t:${2.3+Math.random()*2}s`;dr.append(d)}
document.addEventListener('mousemove',e=>{document.querySelectorAll('.eyes i').forEach(i=>{const r=i.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,d=Math.hypot(x,y)||1;i.style.transform=`translate(${x/d*4}px,${y/d*3}px)`})});
const g=document.getElementById('g'),lb=document.getElementById('lb');
function render(items){
  if(!items.length){g.innerHTML='<p class="empty">هنوز چیزی اضافه نشده. از admin.html عکس و متن اضافه کن.</p>';return}
  items.forEach(it=>{
    const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');
    i.src=it.image;i.loading='lazy';i.alt=it.text||'';c.textContent=it.text||'';
    i.onclick=()=>{lb.querySelector('img').src=it.image;lb.classList.add('on')};
    f.append(i,c);g.append(f);
  });
}
const s=document.createElement('script');s.src='gallery.js?'+Date.now();
s.onload=()=>render(window.GALLERY||[]);
s.onerror=()=>render([]);
document.head.append(s);
</script>

<script>
(function(){
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const dk=document.getElementById('dark');
function pos(x,y){dk.style.setProperty('--x',x+'px');dk.style.setProperty('--y',y+'px')}
addEventListener('mousemove',e=>pos(e.clientX,e.clientY));
addEventListener('touchstart',e=>pos(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
addEventListener('touchmove',e=>pos(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
pos(innerWidth/2,innerHeight*.4);

// blood dripping from the header
const hd=document.getElementById('hd');
for(let i=0;i<26;i++){const d=document.createElement('i');d.className='drip';
 d.style.cssText=`left:${Math.random()*100}%;width:${5+Math.random()*12}px;--h:${25+Math.random()*130}px;--d:${3+Math.random()*4}s;--t:${5.6+Math.random()*6}s`;hd.append(d)}

// blood trail behind cursor
if(!rm){const c=document.getElementById('trail'),x=c.getContext('2d');let P=[];
 function rs(){c.width=innerWidth;c.height=innerHeight}rs();addEventListener('resize',rs);
 function sp(x,y){for(let i=0;i<2;i++)P.push({x:x,y:y,vx:(Math.random()-.5)*1.2,vy:Math.random()*1.5,r:1.5+Math.random()*3,l:1})}
 addEventListener('mousemove',e=>sp(e.clientX,e.clientY));addEventListener('touchmove',e=>sp(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
 (function f(){x.clearRect(0,0,c.width,c.height);P=P.filter(p=>p.l>0);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.l-=.014;x.globalAlpha=Math.max(p.l,0);x.fillStyle='#b3000f';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});
  requestAnimationFrame(f)})()}

// whispers
const W=['پشتت رو نگاه کن...','اون داره می‌بینتت','برنگرد','تنها نیستی','هیچکس برنمی‌گرده','نزدیک‌تره...','ابرام همه چیز رو می‌بینه','صداشو شنیدی؟'];
function whisper(){const e=document.createElement('div');e.className='whisper';e.textContent=W[Math.random()*W.length|0];
 e.style.left=(4+Math.random()*14)+'vw';e.style.top=(12+Math.random()*72)+'vh';e.style.transform='rotate('+(Math.random()*16-8)+'deg)';
 document.body.append(e);setTimeout(()=>e.remove(),4200)}
setTimeout(function w(){whisper();setTimeout(w,6000+Math.random()*7000)},7000);

// rare jump scare (single flash, no strobing)
if(!rm){const j=document.getElementById('js'),sk=document.querySelector('.skull svg');
 if(sk){setTimeout(function js(){j.replaceChildren(sk.cloneNode(true));j.classList.add('on');navigator.vibrate&&navigator.vibrate([200,80,300]);
  setTimeout(()=>j.classList.remove('on'),650);setTimeout(js,45000+Math.random()*60000)},25000+Math.random()*30000)}}

// sound: heartbeat + low drone (off until the button is pressed)
let ac,tm,on=false,nodes=[];
function beat(){const t=ac.currentTime;[0,.3].forEach(o=>{const os=ac.createOscillator(),g=ac.createGain();os.type='sine';
 os.frequency.setValueAtTime(65,t+o);os.frequency.exponentialRampToValueAtTime(28,t+o+.22);
 g.gain.setValueAtTime(0,t+o);g.gain.linearRampToValueAtTime(.85,t+o+.02);g.gain.exponentialRampToValueAtTime(.001,t+o+.32);
 os.connect(g);g.connect(ac.destination);os.start(t+o);os.stop(t+o+.4)})}
document.getElementById('snd').onclick=function(){
 try{
  if(!on){ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();
   const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=150;const g=ac.createGain();g.gain.value=.09;f.connect(g);g.connect(ac.destination);
   nodes=[48,49.4].map(q=>{const o=ac.createOscillator();o.type='sawtooth';o.frequency.value=q;o.connect(f);o.start();return o});
   beat();tm=setInterval(beat,1150);on=true;this.textContent='🔊 صدای جزیره'}
  else{clearInterval(tm);nodes.forEach(o=>o.stop());nodes=[];on=false;this.textContent='🔇 صدای جزیره'}
 }catch(e){}
};
})();
</script>

<script>
(function(){
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches,touch=matchMedia('(pointer:coarse)').matches;
const dk=document.getElementById('dark'),g=document.getElementById('g');

// phones: the light follows the finger, and drifts around by itself when you let go
if(touch){let tx=innerWidth/2,ty=innerHeight*.4,cx=tx,cy=ty,last=0;
 const set=e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;last=Date.now()};
 addEventListener('touchstart',set,{passive:true});addEventListener('touchmove',set,{passive:true});
 (function w(){const t=Date.now();
  if(t-last>2500&&!rm){tx=innerWidth/2+Math.sin(t/1100)*innerWidth*.34;ty=innerHeight/2+Math.cos(t/1500)*innerHeight*.3}
  cx+=(tx-cx)*.12;cy+=(ty-cy)*.12;dk.style.setProperty('--x',cx+'px');dk.style.setProperty('--y',cy+'px');
  requestAnimationFrame(w)})()}

// cards light up as they scroll to the middle of the screen (no hover on phones)
const io=new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('lit',e.isIntersecting)),{rootMargin:'-35% 0px -35% 0px'});
new MutationObserver(()=>g.querySelectorAll('figure:not([data-o])').forEach(f=>{f.dataset.o=1;io.observe(f)})).observe(g,{childList:true});

if(rm)return;
// eyes that appear in the dark
function eyes(n,ms){for(let i=0;i<n;i++){const e=document.createElement('div');e.className='eyes';
 e.style.left=(6+Math.random()*80)+'%';e.style.top=(10+Math.random()*78)+'%';e.innerHTML='<i></i><i></i>';
 document.body.append(e);setTimeout(()=>e.remove(),ms||2600)}}
setTimeout(function f(){eyes(1);setTimeout(f,8000+Math.random()*8000)},9000);

// a shadow figure creeps closer, then lunges
function shade(){const e=document.createElement('div');e.className='shade';
 e.style.left=(8+Math.random()*64)+'%';
 e.innerHTML='<svg viewBox="0 0 100 230" aria-hidden="true"><path d="M2 230C2 130 20 74 50 64C80 74 98 130 98 230Z" fill="#000"/><path d="M14 150C4 190 2 215 6 230M86 150C96 190 98 215 94 230" stroke="#000" stroke-width="7" fill="none"/><ellipse cx="50" cy="30" rx="19" ry="25" fill="#000"/><ellipse cx="42" cy="28" rx="4.5" ry="2.6" fill="#ff1a1a"/><ellipse cx="58" cy="28" rx="4.5" ry="2.6" fill="#ff1a1a"/></svg>';
 document.body.append(e);
 navigator.vibrate&&navigator.vibrate([90,100,90,600,300]);
 setTimeout(()=>e.remove(),5800)}
setTimeout(function sh(){shade();setTimeout(sh,22000+Math.random()*20000)},14000);

// screen glitch
setTimeout(function gl(){const a=[document.querySelector('header'),g];a.forEach(x=>x.classList.add('gl'));
 setTimeout(()=>a.forEach(x=>x.classList.remove('gl')),380);setTimeout(gl,9000+Math.random()*12000)},10000);
})();
</script>
</body>
