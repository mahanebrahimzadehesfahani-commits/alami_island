<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جزیره اعلمی | Alami Island</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0b;--card:#171313;--text:#efe9e6;--mute:#a79b97;--red:#e11d2e;--deep:#5a0007}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.9}
body.locked{overflow:hidden}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 45%,#6d0009 0,#1c0003 55%,#050000 100%);overflow:hidden;cursor:pointer;
 animation:flash 3.8s forwards}
#intro::before{content:"";position:absolute;top:0;left:0;right:0;height:100%;
 background:repeating-linear-gradient(90deg,var(--red) 0 14px,transparent 14px 38px,var(--red) 38px 47px,transparent 47px 90px);
 -webkit-mask:linear-gradient(#000,#000) top/100% 0 no-repeat;mask:linear-gradient(#000,#000) top/100% 0 no-repeat;
 animation:drip 3s ease-in forwards;opacity:.85;transform-origin:top;clip-path:inset(0 0 100% 0)}
#intro::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);pointer-events:none}
@keyframes drip{0%{clip-path:inset(0 0 100% 0)}100%{clip-path:inset(0 0 8% 0)}}
@keyframes flash{0%,82%{opacity:1;visibility:visible}100%{opacity:0;visibility:hidden}}
.skull{font-size:clamp(90px,22vw,170px);position:relative;z-index:2;filter:drop-shadow(0 0 30px var(--red)) drop-shadow(0 0 70px #f00);
 animation:rise .9s cubic-bezier(.2,1.4,.4,1) both,shake .12s .9s 8 alternate,beat 1.1s 1.5s infinite}
@keyframes rise{from{transform:translateY(60px) scale(.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{from{transform:translate(-5px,2px) rotate(-3deg)}to{transform:translate(5px,-2px) rotate(3deg)}}
@keyframes beat{50%{transform:scale(1.08)}}
.t{position:relative;z-index:2;font-weight:800;font-size:clamp(38px,10vw,84px);color:#fff;text-shadow:0 0 18px var(--red),0 0 44px var(--red);
 animation:glitch 3s 1s infinite,fadein 1s .9s both}
.en{position:relative;z-index:2;letter-spacing:.5em;direction:ltr;color:#ff8d95;font-weight:300;font-size:clamp(13px,3.4vw,22px);animation:fadein 1s 1.5s both}
@keyframes fadein{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glitch{0%,90%,100%{transform:none;text-shadow:0 0 18px var(--red),0 0 44px var(--red)}
 92%{transform:translateX(-7px);text-shadow:5px 0 #0ff,-5px 0 var(--red)}94%{transform:translateX(7px);text-shadow:-5px 0 #0ff,5px 0 var(--red)}96%{transform:none}}

/* ---------- site ---------- */
header{text-align:center;padding:90px 20px 50px}
header h1{font-size:clamp(34px,7vw,60px);font-weight:800;letter-spacing:-.01em}
header h1 span{display:block;direction:ltr;font-size:.32em;font-weight:300;color:var(--red);letter-spacing:.45em;margin-top:6px}
header p{color:var(--mute);margin-top:14px}
main{max-width:1060px;margin:0 auto;padding:0 20px 90px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px}
figure{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid #261e1e;transition:border-color .25s}
figure:hover{border-color:var(--red)}
figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
figcaption{padding:16px 18px 20px;white-space:pre-line;font-weight:300}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}
footer{text-align:center;color:#6c6260;padding:30px;border-top:1px solid #1e1818;font-size:14px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:20px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;border-radius:8px}
@media(prefers-reduced-motion:reduce){#intro *,#intro{animation-duration:.01s!important;animation-delay:0s!important}#intro{animation:flash 1.2s forwards!important}}
</style>
</head>
<body class="locked">
<div id="intro" onclick="endIntro()">
  <div class="skull">💀</div>
  <div class="t">جزیره اعلمی</div>
  <div class="en">ALAMI ISLAND</div>
</div>

<header>
  <h1>جزیره اعلمی<span>ALAMI ISLAND</span></h1>
  <p>خوش اومدی به جزیره</p>
</header>
<main id="g"></main>
<footer>Alami Island</footer>
<div id="lb" onclick="this.classList.remove('on')"><img alt=""></div>

<script>
function endIntro(){document.getElementById('intro').style.display='none';document.body.classList.remove('locked')}
setTimeout(endIntro,3800);
const g=document.getElementById('g'),lb=document.getElementById('lb');
fetch('gallery.json?'+Date.now()).then(r=>r.json()).then(items=>{
  if(!items.length){g.innerHTML='<p class="empty">هنوز چیزی اضافه نشده. از admin.html عکس و متن اضافه کن.</p>';return}
  items.forEach(it=>{
    const f=document.createElement('figure'),i=document.createElement('img'),c=document.createElement('figcaption');
    i.src=it.image;i.loading='lazy';i.alt=it.text||'';c.textContent=it.text||'';
    i.onclick=()=>{lb.querySelector('img').src=it.image;lb.classList.add('on')};
    f.append(i,c);g.append(f);
  });
}).catch(()=>{g.innerHTML='<p class="empty">gallery.json لود نشد. سایت رو از روی گیت‌هاب یا یه سرور باز کن.</p>'});
</script>
</body>
</html>
